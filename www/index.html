<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F6FB">
<title>VitalVault</title>
<style>
:root{
  --p:#2B63F6;--pd:#1A47C8;--p50:#EEF3FF;--p100:#DCE6FF;--p200:#BCD0FF;
  --bg:#F4F6FB;--card:#fff;--ink:#0B1220;--ink2:#5B6577;--ink3:#9AA3B2;--line:#EDF0F5;--soft:#F3F5F9;
  --good:#12A26B;--goodbg:#E8F8F1;--bad:#E5484D;--badbg:#FDEDEE;--warn:#C2760C;
  --r:22px;--sh:0 1px 2px rgba(16,24,40,.03),0 10px 30px -12px rgba(16,24,40,.12);
  --grad:linear-gradient(140deg,#0D2466 0%,#1D47D6 52%,#4A85FF 100%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{opacity:.3;cursor:default}
input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--ink2)}.faint{color:var(--ink3)}.small{font-size:13px}.grow{flex:1;min-width:0}
.up{color:var(--good);font-weight:600}.down{color:var(--warn);font-weight:600}
.num{font-variant-numeric:tabular-nums}

/* lock */
.lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(120% 70% at 10% 0%,#3D7BFF 0,transparent 60%),radial-gradient(90% 60% at 100% 100%,#5B8CFF55 0,transparent 60%),#0D2466}
.lock-card{width:100%;max-width:370px;background:rgba(255,255,255,.98);border-radius:30px;padding:34px 26px 24px;box-shadow:0 30px 80px rgba(3,10,40,.45);text-align:center}
.logo{width:60px;height:60px;border-radius:19px;margin:0 auto 16px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 10px 24px -8px #1D47D6aa}
.logo svg.i{width:30px;height:30px}
.lock-card h1{margin:0;font-size:24px;letter-spacing:-.5px}
.lock-card p{margin:6px 0 22px;color:var(--ink2);font-size:14px}
.field{width:100%;padding:15px 16px;border:1.5px solid transparent;border-radius:16px;background:var(--soft);margin-bottom:10px;outline:none;font-size:16px;transition:.15s}
.field:focus{border-color:var(--p);background:#fff}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:2px 0 6px}
.fine{font-size:12px;color:var(--ink3);margin:16px 0 0!important}
.lock-links{display:flex;flex-direction:column;gap:2px;margin-top:8px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:16px;font-weight:650;font-size:15px;transition:transform .08s,background .15s,box-shadow .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--p);color:#fff;box-shadow:0 8px 18px -8px #2B63F6cc}.btn.primary:hover{background:var(--pd)}
.btn.white{background:#fff;color:var(--pd)}
.btn.glass{background:rgba(255,255,255,.16);color:#fff}
.btn.ghost{background:var(--soft);color:var(--ink)}.btn.ghost:hover{background:#E9EDF4}
.btn.soft{background:var(--p50);color:var(--pd)}
.btn.danger{background:var(--bad);color:#fff}
.btn.good{background:var(--good);color:#fff}
.btn.block{width:100%}.btn.sm{padding:9px 14px;font-size:14px;border-radius:12px}
.btn svg.i{width:18px;height:18px}
.link{color:var(--p);font-weight:600;font-size:14px;padding:6px 4px}
.link.muted{color:var(--ink3)}.link.red{color:var(--bad)}
.iconbtn{width:42px;height:42px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink2);background:#fff;box-shadow:var(--sh)}
.iconbtn:hover{color:var(--p)}
.iconbtn.flat{background:none;box-shadow:none;width:36px;height:36px;color:var(--ink3)}
.iconbtn.flat:hover{background:var(--soft)}
.row-btns{display:flex;gap:10px;margin-top:16px}.row-btns .btn{flex:1}

/* shell */
.nav{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:calc(100% - 28px);max-width:420px;display:flex;padding:7px;gap:4px;background:rgba(255,255,255,.88);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);border-radius:24px;box-shadow:0 12px 40px -10px rgba(16,24,40,.28),0 0 0 1px rgba(16,24,40,.04)}
.nav .brand,.nav .nv.set{display:none}
.nv{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:650;color:var(--ink3);padding:8px 0 6px;border-radius:18px;position:relative;transition:.15s}
.nv.on{color:var(--p);background:var(--p50)}
.badge{position:absolute;top:4px;left:calc(50% + 7px);background:var(--bad);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;box-shadow:0 0 0 2px #fff}
main{padding:calc(14px + env(safe-area-inset-top)) 18px 110px}
.wrap{max-width:560px;margin:0 auto}
@media (min-width:900px){
  .nav{top:0;bottom:0;left:0;transform:none;width:240px;max-width:none;flex-direction:column;border-radius:0;padding:24px 16px;gap:4px;background:#fff;box-shadow:none;border-right:1px solid var(--line)}
  .nav .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.3px;padding:0 10px 26px}
  .nav .brand .logo{width:36px;height:36px;border-radius:12px;margin:0;box-shadow:none}.nav .brand .logo svg.i{width:19px;height:19px}
  .nav .nv.set{display:flex;margin-top:auto}
  .nv{flex:none;flex-direction:row;gap:12px;font-size:15px;padding:12px 14px;color:var(--ink2);border-radius:14px}
  .nv:hover{background:var(--soft)}
  .badge{position:static;margin-left:auto;box-shadow:none}
  main{margin-left:240px;padding:34px 40px 60px}
  .wrap{max-width:880px}
  .mob{display:none!important}
}

/* page header */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 2px 18px}
.ph-sub{font-size:13.5px;color:var(--ink2);font-weight:500}
.ph h1{margin:0;font-size:30px;letter-spacing:-.8px;line-height:1.1}
.ph-act{display:flex;gap:8px}
.datechip{display:inline-flex;align-items:center;gap:2px;margin-top:8px;background:#fff;border-radius:999px;padding:3px;box-shadow:var(--sh);font-size:13.5px;font-weight:600}
.datechip button{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.datechip button:hover:not(:disabled){background:var(--soft)}
.datechip span{padding:0 6px}

/* balance card */
.bal{position:relative;overflow:hidden;background:var(--grad);color:#fff;border-radius:28px;padding:22px;box-shadow:0 20px 40px -18px #1D47D6cc;margin-bottom:18px}
.bal::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 80% at 100% 0%,rgba(255,255,255,.18),transparent 60%),radial-gradient(40% 60% at 0% 100%,rgba(120,170,255,.25),transparent 70%);pointer-events:none}
.bal>*{position:relative;z-index:1}
.bal-l{font-size:13px;opacity:.78;font-weight:500}
.bal-main{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:2px}
.bal-num{font-size:52px;font-weight:750;letter-spacing:-2px;line-height:1}
.bal-num small{font-size:16px;font-weight:500;opacity:.7;letter-spacing:0;margin-left:4px}
.bal-note{font-size:13px;opacity:.85;margin-top:6px}
.prog{height:6px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:18px}
.prog i{display:block;height:100%;background:#fff;border-radius:3px;transition:width .3s}
.bal-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-size:13px}
.bal-foot b{font-weight:650}
.bal .btn{padding:9px 14px;font-size:13.5px;border-radius:12px}

/* tabs */
.tabs{display:flex;gap:4px;background:#E9EDF5;padding:4px;border-radius:16px;margin-bottom:16px}
.tabs button{flex:1;padding:9px 6px;border-radius:12px;font-size:13px;font-weight:650;color:var(--ink2);line-height:1.15;transition:.15s}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.1)}
.pills{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.pills button{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:650;color:var(--ink2);background:#fff;box-shadow:0 0 0 1px var(--line)}
.pills button.on{background:var(--ink);color:#fff;box-shadow:none}

/* cards */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:14px}
.card h3{margin:0;font-size:16px;letter-spacing:-.2px}
.card .sub{color:var(--ink2);font-size:13px;margin:3px 0 0}
.chead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
.kpi{text-align:right;white-space:nowrap}.kpi b{display:block;font-size:20px;letter-spacing:-.4px}.kpi span{font-size:12px;color:var(--ink3)}
.sec-t{font-size:13px;font-weight:700;color:var(--ink3);margin:22px 4px 10px;letter-spacing:.2px}
.empty{text-align:center;color:var(--ink3);padding:28px 10px;font-size:14px}

/* consumption tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (min-width:700px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tw{position:relative}
.ctile{width:100%;text-align:left;background:#fff;border-radius:22px;box-shadow:var(--sh);padding:16px;display:flex;flex-direction:column;gap:10px;min-height:128px;transition:transform .08s,box-shadow .15s}
.ctile:active{transform:scale(.97)}
.ctile.on{box-shadow:0 0 0 2px var(--c),var(--sh)}
.ctop{display:flex;align-items:center;justify-content:space-between}
.cemo{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--cb)}
.ccount{font-size:26px;font-weight:750;letter-spacing:-.6px}
.cname{font-weight:650;font-size:14px}
.chint{font-size:12px;color:var(--ink3);margin-top:-8px}
.cdots{display:flex;gap:4px;flex-wrap:wrap;min-height:14px}
.cdots i{width:14px;height:14px;border-radius:4px;background:var(--c);display:flex;align-items:center;justify-content:center}
.cdots i::after{content:"";width:6px;height:3px;border:solid #fff;border-width:0 0 2px 2px;transform:rotate(-45deg) translate(1px,-1px)}
.cdots .add{background:none;box-shadow:inset 0 0 0 1.5px var(--line)}.cdots .add::after{display:none}
.cminus{position:absolute;right:10px;bottom:10px;width:32px;height:32px;border-radius:11px;background:var(--soft);color:var(--ink2);display:flex;align-items:center;justify-content:center}
.cminus:hover{background:var(--badbg);color:var(--bad)}
.cminus svg.i{width:16px;height:16px}

/* ratings */
.q{font-size:17px;font-weight:700;letter-spacing:-.3px;margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:14px;background:var(--soft);font-weight:600;font-size:14px;transition:.12s}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip:hover{background:#E9EDF4}
.chip.sel{background:var(--c);color:#fff}.chip.sel i{background:#fff}
.chips.lg .chip{padding:14px 16px;font-size:15px}
.week{display:flex;gap:6px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.week div{flex:1;text-align:center;font-size:11px;color:var(--ink3);font-weight:600}
.week i{display:block;height:8px;border-radius:4px;background:var(--line);margin-bottom:6px}

/* question card */
.qcard{display:flex;align-items:center;gap:14px}
.qcard .ico{width:46px;height:46px;border-radius:15px;background:var(--p50);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.qbtns{display:flex;gap:8px;margin-top:14px}.qbtns .btn{flex:1;padding:12px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:650;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--ink2)}
.status.g{background:var(--goodbg);color:var(--good)}.status.b{background:var(--p50);color:var(--pd)}

/* workout */
.next{position:relative;overflow:hidden}
.next .tag{display:inline-block;font-size:12px;font-weight:650;color:var(--pd);background:var(--p50);border-radius:8px;padding:3px 8px}
.next h2{margin:8px 0 2px;font-size:24px;letter-spacing:-.6px}
.exl{list-style:none;margin:14px 0 0;padding:0}
.exl li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;font-size:14px;border-top:1px solid var(--line)}
.exl li span:last-child{color:var(--ink2);white-space:nowrap}
.minis{display:flex;gap:10px;margin-bottom:14px}
.mini{flex:1;background:#fff;border-radius:18px;box-shadow:var(--sh);padding:12px 14px}
.mini b{display:block;font-size:20px;letter-spacing:-.4px}.mini span{font-size:12px;color:var(--ink3);font-weight:600}
.ex .eh{display:flex;align-items:flex-start;gap:10px}
.eq{font-size:12px;color:var(--ink3);font-weight:600}
.wbox{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 6px;padding:12px 12px 12px 14px;background:var(--soft);border-radius:18px;flex-wrap:wrap}
.wbox .lbl{font-size:13px;font-weight:650;color:var(--ink2)}.wbox .lbl small{display:block;font-weight:500;color:var(--ink3);font-size:12px}
.delta{flex-basis:100%;font-size:12.5px;margin-top:-2px}
.stepper{display:inline-flex;align-items:center;background:#fff;border-radius:14px;box-shadow:0 0 0 1px var(--line)}
.stepper>button{width:42px;height:42px;display:flex;align-items:center;justify-content:center;color:var(--p);border-radius:14px}
.stepper>button:hover{background:var(--p50)}
.stepper .val{display:flex;align-items:baseline;gap:3px}
.stepper input{width:56px;border:0;text-align:center;font-weight:750;font-size:19px;background:transparent;outline:none;-moz-appearance:textfield;letter-spacing:-.3px}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper .val span{font-size:12px;color:var(--ink3);margin-right:2px}
.stepper.sm{box-shadow:none;background:transparent}.stepper.sm>button{width:32px;height:34px}.stepper.sm input{width:36px;font-size:16px}.stepper.sm svg.i{width:16px;height:16px}
.sets{margin-top:6px}
.set{display:flex;align-items:center;gap:8px;padding:6px 4px;border-radius:14px;transition:background .15s}
.set+.set{border-top:1px solid var(--line)}
.set.done{background:var(--goodbg);border-color:transparent}
.set.done+.set{border-color:transparent}
.chk{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 2px #D5DBE5;display:flex;align-items:center;justify-content:center;color:transparent;flex:none}
.chk.on{background:var(--good);box-shadow:none;color:#fff}.chk svg.i{width:17px;height:17px;stroke-width:2.6}
.set .sn{font-size:13.5px;font-weight:650;width:48px}
.set .sw{font-size:12.5px;color:var(--ink3);margin-left:auto}
.efoot{display:flex;justify-content:space-between;margin-top:6px}
.cf{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;flex-wrap:wrap}
.cf+.cf{border-top:1px solid var(--line)}
.cf .lbl{font-weight:650;font-size:14px}.cf .lbl small{display:block;font-weight:500;font-size:12px}
.sheet .pday{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;text-align:left;width:100%;background:var(--soft);margin-bottom:8px}
.sheet .pday.cur{background:var(--p50);box-shadow:inset 0 0 0 1.5px var(--p)}
.pday .n{width:30px;height:30px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:750;font-size:13px;flex:none}
.pday.cur .n{background:var(--p);color:#fff}
.prog-opt{display:block;width:100%;text-align:left;padding:14px;border-radius:16px;background:var(--soft);margin-bottom:8px}
.prog-opt.cur{background:var(--p50);box-shadow:inset 0 0 0 1.5px var(--p)}
.prog-opt b{display:block}.prog-opt span{font-size:13px;color:var(--ink2)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:11px;color:var(--ink3);font-weight:650;padding:4px 0}
.cal button{aspect-ratio:1;border-radius:12px;font-size:13.5px;font-weight:550;display:flex;align-items:center;justify-content:center;max-height:44px;position:relative}
.cal button.w{background:var(--p);color:#fff;font-weight:700}
.cal button.y:not(.w)::after{content:"";position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--p)}
.cal button.today{box-shadow:inset 0 0 0 2px var(--p200)}
.cal button.selday{box-shadow:0 0 0 3px var(--p200)}
.cal button.out{visibility:hidden}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.wk{cursor:pointer;padding:14px 16px}
.wk-sum{display:flex;gap:12px;align-items:center}
.wk-date{width:46px;text-align:center;background:var(--p50);border-radius:14px;padding:7px 0;color:var(--pd);flex:none}
.wk-date b{display:block;font-size:18px;line-height:1}.wk-date span{font-size:10.5px;font-weight:700;text-transform:uppercase}
.wk-detail{margin-top:12px}
.mrow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.mrow span:last-child{color:var(--ink2);text-align:right}
.pick-g{font-size:12px;font-weight:700;color:var(--ink3);margin:16px 4px 6px}
.pick-i{display:flex;width:100%;text-align:left;padding:12px;border-radius:14px;align-items:center;gap:10px}
.pick-i:hover{background:var(--p50)}.pick-i .plus{margin-left:auto;color:var(--p)}
.t{font-weight:650}.s{font-size:13px;color:var(--ink2)}

/* charts */
.grid2{display:grid;gap:0 14px}
@media (min-width:1200px){.grid2{grid-template-columns:1fr 1fr}}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart .gl{stroke:#EEF1F6;stroke-width:1;stroke-dasharray:3 4}
svg.chart text{font-size:11px;fill:var(--ink3);font-family:inherit}
svg.chart .yl{text-anchor:end}svg.chart .xl{text-anchor:middle}
svg.chart .hov{fill:transparent}svg.chart .hov:hover{fill:rgba(43,99,246,.05)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12.5px;color:var(--ink2)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.selrow{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.selrow select,.sel{flex:1;min-width:130px;padding:10px 12px;border:0;border-radius:12px;background:var(--soft);font-size:14px;font-weight:600;outline:none}
.rbadge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--soft)}
table.corr{width:100%;border-collapse:separate;border-spacing:3px;font-size:13px}
table.corr th{font-weight:650;color:var(--ink2);font-size:12px;padding:4px}
table.corr th.rh{text-align:left;white-space:nowrap}
table.corr td{text-align:center;border-radius:9px;padding:9px 2px;font-weight:650;font-variant-numeric:tabular-nums}
#tip{position:fixed;z-index:100;pointer-events:none;background:#0B1220;color:#fff;font-size:12.5px;border-radius:12px;padding:9px 11px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:none;max-width:240px;line-height:1.55}
#tip b{display:block;margin-bottom:2px}

/* insights */
.irow{display:flex;gap:12px;align-items:flex-start;padding:14px 0}
.irow+.irow{border-top:1px solid var(--line)}
.irow:first-child{padding-top:2px}.irow:last-child{padding-bottom:0}
.irow .ii{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:19px;flex:none;background:var(--soft)}
.irow.good .ii{background:var(--goodbg)}.irow.bad .ii{background:var(--badbg)}
.irow .t{font-size:14.5px}
.dot-new{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--p);margin-left:6px;vertical-align:2px}

/* ---------- crypto ---------- */
const TE=new TextEncoder(),TD=new TextDecoder();
const ITER=310000;
function b64(buf){const b=new Uint8Array(buf);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)}
function unb64(s){const bin=atob(s);const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b}
async function deriveKey(pass,salt,iter=ITER){
  const base=await crypto.subtle.importKey('raw',TE.encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
let KEY=null,SALT=null,S=null;
async function encryptData(obj){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},KEY,TE.encode(JSON.stringify(obj)));
  return JSON.stringify({app:'VitalVault',v:1,kdf:'PBKDF2-SHA256',iter:ITER,savedAt:Date.now(),salt:b64(SALT),iv:b64(iv),ct:b64(ct)});
}
async function decryptBlob(str,pass){
  let o;try{o=JSON.parse(str)}catch(e){throw new Error('This file is not a VitalVault vault.')}
  if(o.app!=='VitalVault'||!o.ct)throw new Error('This file is not a VitalVault vault.');
  const salt=unb64(o.salt);const key=await deriveKey(pass,salt,o.iter||ITER);
  let pt;try{pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},key,unb64(o.ct))}catch(e){throw new Error('Incorrect passphrase.')}
  return{data:JSON.parse(TD.decode(pt)),key,salt};
}

    const id=a.notification&&a.notification.id,act=a.actionId;
    if(id===2&&(act==='yes'||act==='no')){
      if(S){day(todayKey()).wo=act;save();render();toast(act==='yes'?'Logged: working out today 💪':'Logged: rest day')}
      else{await queueWo(act);$('#lock-sub').textContent=act==='yes'?'Logged: working out today 💪 Unlock to see your plan.':'Logged: rest day today. Unlock to continue.'}
      return;
    }

function runIntent(){const i=INTENT;INTENT=null;if(i==='checkin')openCheckin();else if(i==='woq')openWoQ()}
function desktopNotify(title,body){try{if(!LN&&'Notification' in window&&Notification.permission==='granted'&&document.hidden)new Notification(title,{body})}catch(e){}}
function minsNow(){const d=new Date();return d.getHours()*60+d.getMinutes()}
const toMins=s=>{const[h,m]=s.split(':').map(Number);return h*60+m};
function checkReminders(){
  if(!S||!$('#modal').hidden)return;
  const t=todayKey(),st=S.settings,d=S.days[t],m=minsNow();
  if(st.remCheckin&&m>=toMins(st.timeCheckin)&&st.lastPrompt!==t&&!(d&&RATINGS.every(k=>d[k]!=null))){st.lastPrompt=t;save();openCheckin();desktopNotify('Good morning ☀️','Time for your daily check-in.');return}
  if(st.remWorkout&&m>=toMins(st.timeWorkout)&&st.lastWoPrompt!==t&&!(d&&d.wo)){st.lastWoPrompt=t;save();openWoQ();desktopNotify('Working out today?','Open VitalVault to answer.')}
}
setInterval(checkReminders,30000);

/* =========================================================
   LOCK SCREEN
   ========================================================= */
let LOCKMODE='unlock',PENDING=null;
$('#lock-logo').innerHTML=ico('shield');
async function showLock(msg){
  $('#app').hidden=true;$('#lock').hidden=false;closeSheet();
  const has=PENDING||await IDB.get('vault').catch(()=>null)||(NFS&&await nativeRead())||(FSA&&await IDB.get('dir').catch(()=>null));
  LOCKMODE=has?'unlock':'create';
  $('#pass2').hidden=LOCKMODE!=='create';
  $('#pass').placeholder=LOCKMODE==='create'?'Create a passphrase':'Passphrase';
  $('#pass').autocomplete=LOCKMODE==='create'?'new-password':'current-password';
  $('#lock-btn').textContent=LOCKMODE==='create'?'Create my vault':'Unlock';
  $('#lock-sub').textContent=msg||(LOCKMODE==='create'?'Choose a passphrase to encrypt your data. It never leaves this device and can\'t be recovered if forgotten.':'Welcome back. Enter your passphrase.');
  $('#lock-folder').hidden=!FSA;
  $('#lock-err').textContent='';$('#pass').value='';$('#pass2').value='';
  setTimeout(()=>$('#pass').focus(),50);
}
$('#lock-form').addEventListener('submit',async e=>{
  e.preventDefault();const p=$('#pass').value,err=$('#lock-err'),btn=$('#lock-btn');err.textContent='';
  if(!window.crypto||!crypto.subtle){err.textContent='Encryption is not available here. Open the file in Chrome, Edge or Firefox.';return}
  if(LOCKMODE==='create'){
    if(p.length<6){err.textContent='Use at least 6 characters.';return}
    if(p!==$('#pass2').value){err.textContent='Passphrases don\'t match.';return}
    btn.disabled=true;btn.textContent='Creating…';
    SALT=crypto.getRandomValues(new Uint8Array(16));KEY=await deriveKey(p,SALT);S=blank();
    await saveNow();btn.disabled=false;enterApp(true);return;
  }
  btn.disabled=true;btn.textContent='Unlocking…';
  try{
    let blob=PENDING;
    if(!blob){const bl=await loadBlobs(true);blob=bl[0]&&bl[0].s}
    if(!blob)throw new Error('No vault found on this device.');
    const r=await decryptBlob(blob,p);
    S=migrate(r.data);KEY=r.key;SALT=r.salt;
    if(PENDING){PENDING=null;await saveNow()}
    enterApp(false);
  }catch(ex){err.textContent=ex.message}
  btn.disabled=false;btn.textContent='Unlock';
});
$('#lock-restore').addEventListener('click',()=>pickFile(async txt=>{PENDING=txt;await showLock('Backup loaded. Enter the passphrase used for this backup. It will replace data on this device.');LOCKMODE='unlock';$('#pass2').hidden=true;$('#lock-btn').textContent='Restore & unlock'}));
$('#lock-folder').addEventListener('click',async()=>{
  try{const d=await showDirectoryPicker({mode:'readwrite',id:'vitalvault'});DIR=d;const txt=await folderRead();await IDB.set('dir',d);folderOK=true;
    if(txt){PENDING=txt;await showLock(`Vault found in “${d.name}”. Enter its passphrase.`);LOCKMODE='unlock';$('#pass2').hidden=true;$('#lock-btn').textContent='Unlock'}
    else{toast('No vault in that folder yet — it will be saved there once you unlock or create one.');showLock()}
  }catch(e){}
});
function pickFile(cb){const f=$('#file-in');f.value='';f.onchange=async()=>{const file=f.files[0];if(file)cb(await file.text())};f.click()}

async function enterApp(isNew){
  $('#lock').hidden=true;$('#app').hidden=false;
  UI.date=todayKey();UI.view=S.active?'workout':'health';
  await applyQueue();
  render();
  if(isNew)setTimeout(()=>toast('Vault created & encrypted 🔒'),200);
  setupNotifications(isNew);
  if(INTENT){setTimeout(runIntent,250)}
  else{
    const t=todayKey(),d=S.days[t];
    if(S.settings.lastPrompt!==t&&!(d&&RATINGS.every(k=>d[k]!=null))){S.settings.lastPrompt=t;save();setTimeout(openCheckin,isNew?600:300)}
    else setTimeout(checkReminders,400);
  }
  maybeNotify();
}
async function lock(){await saveNow();KEY=null;S=null;$('#main').innerHTML='';showLock()}
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
  if(!S)return;
  if(document.hidden){hiddenAt=Date.now();saveNow()}
  else{if(S.settings.autolock>0&&hiddenAt&&Date.now()-hiddenAt>S.settings.autolock*60000)lock();else{if(UI.date!==todayKey()&&UI.view==='health'){UI.date=todayKey();render()}checkReminders()}}
});
addEventListener('beforeunload',()=>{if(S)saveNow()});

const VIEWS={health:vHealth,workout:vWorkout,graphs:vGraphs,insights:vInsights,settings:vSettings};
function render(){
  if(!S)return;
  const y=scrollY;renderNav();$('#main').innerHTML=VIEWS[UI.view]();scrollTo(0,y);
}
function renderNav(){
  const n=newInsightCount();
  const items=[['health','heart','Today'],['workout','dumbbell','Workout'],['graphs','chart','Trends'],['insights','bell','Insights'],['settings','gear','Settings']];
  $('#nav').innerHTML=`<div class="brand"><div class="logo">${ico('shield')}</div>VitalVault</div>`+items.map(([v,i,l])=>`<button class="nv ${v==='settings'?'set':''} ${UI.view===v?'on':''}" data-a="nav" data-v="${v}">${ico(i)}<span>${l}</span>${v==='insights'&&n?`<span class="badge">${n}</span>`:''}</button>`).join('');

function ph(title,sub,extra=''){return`<div class="ph"><div><div class="ph-sub">${sub??greet()}</div><h1>${title}</h1>${extra}</div><div class="ph-act"><button class="iconbtn mob" data-a="nav" data-v="settings" title="Settings">${ico('gear',20)}</button><button class="iconbtn" data-a="lock" title="Lock">${ico('lock',20)}</button></div></div>`}
function ring(v){const r=30,c=2*Math.PI*r,p=v==null?0:v/100;return`<svg width="76" height="76" viewBox="0 0 76 76" style="flex:none"><circle cx="38" cy="38" r="${r}" stroke="rgba(255,255,255,.2)" stroke-width="7" fill="none"/><circle cx="38" cy="38" r="${r}" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 38 38)"/></svg>`}
const tabs=(items,cur,a,cls='tabs')=>`<div class="${cls}">${items.map(([v,l])=>`<button class="${cur===v?'on':''}" data-a="${a}" data-v="${v}">${l}</button>`).join('')}</div>`;

/* ---------- TODAY ---------- */
function vHealth(){
  const k=UI.date,d=S.days[k],sc=score(d),done=RATINGS.filter(x=>d&&d[x]!=null).length,isT=k===todayKey();
  const dc=`<div class="datechip"><button data-a="day" data-n="-1">${ico('chevL',16)}</button><span>${isT?'Today':fmtDate(k)}</span><button data-a="day" data-n="1" ${isT?'disabled':''}>${ico('chevR',16)}</button></div>`;
  const note=sc==null?'Complete a check-in to see your score':sc>=75?'You\'re doing great today':sc>=55?'A solid day so far':sc>=35?'Take it easy on yourself today':'A rough one — tomorrow\'s a reset';
  const bal=`<div class="bal"><div class="bal-l">Wellness score</div><div class="bal-main"><div><div class="bal-num num">${sc??'—'}<small>/ 100</small></div><div class="bal-note">${note}</div></div>${ring(sc)}</div>
    <div class="prog"><i style="width:${done*25}%"></i></div>
    <div class="bal-foot"><span><b>${done} of 4</b> check-ins</span>${done<4?`<button class="btn white" data-a="checkin">${done?'Continue':'Check in'}</button>`:'<span>All done ✓</span>'}</div></div>`;
  let body;
  if(UI.hTab==='cons')body=consTab(k);
  else if(UI.hTab==='sleep')body=rateCard('sleep',k)+rateCard('stress',k);
  else body=rateCard(UI.hTab,k);
  return ph(isT?'Today':fmtDate(k,{weekday:'long'}),null,dc)+bal+(isT?woqCard(true):'')+tabs([['cons','Consumption'],['sleep','Sleep &amp; Stress'],['gut','Gut'],['overall','Overall']],UI.hTab,'htab')+body;
}
function consTab(k){
  const c=(S.days[k]||{}).c||{};
  return`<div class="tiles">${CONS.map(it=>{const n=c[it.k]||0;
    const dots=n>10?`<span class="small faint">${n} logged</span>`:Array.from({length:n},()=>'<i></i>').join('')+'<i class="add"></i>';
    return`<div class="tw" style="--c:${it.c};--cb:${it.c}1f"><button class="ctile ${n?'on':''}" data-a="cons-add" data-k="${it.k}"><div class="ctop"><span class="cemo">${it.e}</span><span class="ccount num">${n}</span></div><div><div class="cname">${it.n}</div></div><div class="cdots">${dots}</div></button>${n?`<button class="cminus" data-a="cons-rm" data-k="${it.k}" title="Remove one">${ico('minus')}</button>`:''}</div>`}).join('')}</div>
  <p class="small faint" style="text-align:center;margin:14px 0 0">Tap a card each time you have one</p>`;
}
function chipsHtml(k,cur,a){return SCALES[k].opts.map((l,i)=>`<button class="chip ${cur===i?'sel':''}" style="--c:${goodColor(goodPct(k,i))}" data-a="${a}" data-k="${k}" data-i="${i}"><i></i>${l}</button>`).join('')}
function rateCard(k,dk){
  const sc=SCALES[k],cur=(S.days[dk]||{})[k];
  const week=rangeKeys(dk,7).map(x=>{const v=S.days[x]?.[k];return`<div><i style="${v!=null?'background:'+goodColor(goodPct(k,v)):''}" data-tip="${esc(`<b>${fmtDate(x)}</b>${v!=null?sc.opts[v]:'Not logged'}`)}"></i>${parseYmd(x).toLocaleDateString(undefined,{weekday:'narrow'})}</div>`}).join('');
  return`<div class="card"><div class="q">${sc.e} ${sc.q}</div><div class="s">${cur!=null?`<b style="color:${goodColor(goodPct(k,cur))}">${sc.opts[cur]}</b> · tap again to clear`:'Pick one'}</div><div class="chips">${chipsHtml(k,cur,'rate')}</div><div class="week">${week}</div></div>`;
}
function openCheckin(){UI.ci=0;const d=S.days[todayKey()];if(d)while(UI.ci<4&&d[RATINGS[UI.ci]]!=null)UI.ci++;if(UI.ci>=4)UI.ci=0;openSheet(ciHtml())}
function ciHtml(){
  const i=UI.ci;
  if(i>=4){const sc=score(S.days[todayKey()]);return`<div class="center"><div class="bigico">${ico('check')}</div><h3>All checked in</h3><p class="muted">Today's wellness score is <b>${sc??'—'}</b>.<br>Log consumption on the Today tab as your day goes on.</p><button class="btn primary block" data-a="ci-close">Done</button></div>`}

/* working out today? */
function woqCard(onlyIfDue){
  const t=todayKey(),d=S.days[t],ans=d&&d.wo,did=S.workouts.some(w=>w.date===t);
  if(onlyIfDue&&(ans||did||!S.settings.remWorkout||minsNow()<toMins(S.settings.timeWorkout)))return'';

function openWoQ(){

/* ---------- WORKOUT ---------- */
function vWorkout(){
  if(S.active)return vSession();
  if(UI.edit)return vBuilder();
  if(UI.detail)return vDetail();
  const t=todayKey(),ws=weekStart(t);
  const thisWeek=new Set(S.workouts.filter(w=>w.date>=ws).map(w=>w.date)).size;
  const m=t.slice(0,7),thisMonth=new Set(S.workouts.filter(w=>w.date.startsWith(m)).map(w=>w.date)).size;
  const minis=`<div class="minis"><div class="mini"><b class="num">${thisWeek}</b><span>This week</span></div><div class="mini"><b class="num">${thisMonth}</b><span>This month</span></div><div class="mini"><b class="num">${S.workouts.length}</b><span>All time</span></div></div>`;
  return ph('Workout')+minis+tabs([['plan','Routines'],['history','History']],UI.wTab,'wtab')+(UI.wTab==='history'?historyTab():routinesTab());
}
const shortName=id=>exInfo(id).n.replace(/^(Smith Machine|Smith|Dumbbell) /,'');
function itemSummary(it){const e=exInfo(it.ex),st=S.plan.state[it.ex]||{};
  if(e.t==='c'){const sp=e.f&&e.f.includes('speed')?` · ${fmtSp(st.speed??it.speed??e.speed)} ${SPU()}`:'';return`${it.min||10} min${sp}`}
  const w=st.w??e.w0;return`${it.sets} × ${it.reps}${e.rs?' sec':''}${w?` · ${fmtW(w)} ${U()}`:''}`}
const findRoutine=id=>QUICK.find(r=>r.id===id)||(S.routines||[]).find(r=>r.id===id);
function rMins(items){return Math.max(5,Math.round(sum(items.map(it=>exInfo(it.ex).t==='c'?(it.min||10):(it.sets||3)*2.5))/5)*5)}
const rMeta=items=>`${items.length} exercise${items.length===1?'':'s'} · ~${rMins(items)} min`;
function rFocus(items){const c={};for(const it of items){const m=exInfo(it.ex).m||'other';c[m]=(c[m]||0)+1}const top=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,2).map(x=>mName(x[0]));return top.join(' & ')}
const coverHtml=(r,size='')=>`<div class="cover ${size}" style="--g:${COVERS[(r.c||0)%COVERS.length]}"><span class="emo">${r.e||'💪'}</span><span class="ct">${esc(r.cn||r.n)}</span></div>`;
const plCard=(r,a,id,sub)=>`<button class="pl" data-a="${a}" data-id="${id}">${coverHtml(r)}<div class="pt">${esc(r.n)}</div><div class="ps">${sub}</div></button>`;
const backBtn=(l='Workout')=>`<button class="backbtn" data-a="wback">${ico('chevL',18)} ${l}</button>`;
function routinesTab(){
  const P=PROGRAMS[S.plan.prog],idx=S.plan.idx%P.days.length,D=P.days[idx];
  const cont=`<div class="card nowp" data-a="open-prog" data-id="${S.plan.prog}">${coverHtml(P,'sm')}<div class="grow"><div class="kick">Continue your program</div><div class="t" style="font-size:16px">${D.n}</div><div class="s">${P.n} · Day ${idx+1} of ${P.days.length}</div></div><button class="play sm" data-a="start-plan" title="Start ${esc(D.n)}">${ico('play')}</button></div>`;
  const mine=`<button class="pl" data-a="new-routine"><div class="cover new">${ico('plus',30)}<span class="ct">Make your own</span></div><div class="pt">New routine</div><div class="ps">Choose from ${Object.keys(EX).length}+ exercises</div></button>`+(S.routines||[]).map(r=>plCard(r,'open-routine',r.id,rMeta(r.items))).join('');
  return woqCard(false)+cont+
    `<div class="shead"><h2>Your routines</h2></div><div class="shelf">${mine}</div>`+
    `<div class="shead"><h2>Quick routines</h2><span class="s">Basic workouts for an apartment gym</span></div><div class="shelf">${QUICK.map(r=>plCard(r,'open-routine',r.id,rMeta(r.items))).join('')}</div>`+
    `<div class="shead"><h2>Programs</h2><span class="s">Multi-day plans that rotate for you</span></div><div class="shelf">${Object.entries(PROGRAMS).map(([k,p])=>plCard(p,'open-prog',k,`${p.days.length}-day program${k===S.plan.prog?' · <b style="color:var(--p)">Following</b>':''}`)).join('')}</div>`+
    `<div class="row-btns"><button class="btn ghost" data-a="start-custom">${ico('plus',18)} Empty workout</button><button class="btn ghost" data-a="start-custom" data-past="1">${ico('cal',18)} Log past day</button></div>`;
}
function trk(it,i){const e=exInfo(it.ex);return`<div class="trk"><span class="tn">${i+1}</span><div class="grow"><div class="t">${esc(e.n)}</div><div class="s">${itemSummary(it)}</div></div><span class="mt" style="--mc:${MCOL[e.m]||MCOL.other}">${mName(e.m)}</span></div>`}
function vDetail(){
  const d=UI.detail;
  if(d.type==='prog'){
    const P=PROGRAMS[d.id],fol=S.plan.prog===d.id,idx=fol?S.plan.idx%P.days.length:0;
    return backBtn()+`<div class="dh">${coverHtml(P,'big')}<div class="dinfo"><div class="kick">Program</div><h1>${P.n}</h1><p class="s">${P.d}</p><div class="s">${P.days.length} workouts · rotates automatically</div></div></div>
     <div class="dact"><button class="btn ${fol?'soft':'ghost'} sm" data-a="follow" data-id="${d.id}">${fol?'✓ Following':'Follow program'}</button><span class="grow"></span><button class="play" data-a="start-day" data-id="${d.id}" data-i="${idx}" title="Start">${ico('play')}</button></div>
     <div class="card trks">${P.days.map((D,i)=>{const cur=fol&&i===idx;return`<div class="trk ${cur?'cur':''}" ${fol?`data-a="plan-set" data-i="${i}"`:''}><span class="tn">${i+1}</span><div class="grow"><div class="t">${D.n}${cur?'<span class="nexttag">Up next</span>':''}</div><div class="s">${D.items.map(x=>shortName(x.ex)).join(' · ')}</div></div><button class="play xs" data-a="start-day" data-id="${d.id}" data-i="${i}" title="Start ${esc(D.n)}">${ico('play')}</button></div>`}).join('')}</div>
     ${fol?'<p class="small faint" style="text-align:center">Tap a day to make it your next workout.</p>':''}`;
  }
  const r=findRoutine(d.id);if(!r){UI.detail=null;return vWorkout()}
  const own=!r.id.startsWith('q_');
  return backBtn()+`<div class="dh">${coverHtml(r,'big')}<div class="dinfo"><div class="kick">${own?'Your routine':'Quick routine'}</div><h1>${esc(r.n)}</h1>${r.d?`<p class="s">${esc(r.d)}</p>`:''}<div class="s">${rMeta(r.items)} · ${rFocus(r.items)}</div></div></div>
   <div class="dact">${own?`<button class="btn ghost sm" data-a="edit-routine" data-id="${r.id}">${ico('edit',16)} Edit</button><button class="iconbtn flat" data-a="del-routine" data-id="${r.id}" title="Delete routine">${ico('trash',20)}</button>`:`<button class="btn ghost sm" data-a="copy-routine" data-id="${r.id}">${ico('edit',16)} Customize</button>`}<span class="grow"></span><button class="play" data-a="start-routine" data-id="${r.id}" title="Start">${ico('play')}</button></div>
   <div class="card trks">${r.items.map(trk).join('')}</div>`;
}
function vBuilder(){
  const E=UI.edit;
  const rows=E.items.map((it,i)=>{const e=exInfo(it.ex);
    const ctl=e.t==='c'?stepper('bmin',i,it.min,'min','',true):stepper('bsets',i,it.sets,'sets','',true)+stepper('breps',i,it.reps,e.rs?'sec':'reps','',true);

let CW=600,GID=0;

function niceStep(r,c){const raw=r/c;const p=Math.pow(10,Math.floor(Math.log10(raw)));const m=raw/p;return(m<=1?1:m<=2?2:m<=5?5:10)*p}

function barChart(o){

function buckets(r){
  const t=todayKey(),out=[];
  if(r==='d')for(let i=29;i>=0;i--){const k=addDays(t,-i),d=parseYmd(k);out.push({label:`${d.getMonth()+1}/${d.getDate()}`,tip:fmtDate(k),keys:[k]})}
  else if(r==='w'){const mon=weekStart(t);for(let i=11;i>=0;i--){const s=addDays(mon,-7*i),sd=parseYmd(s);out.push({label:`${sd.getMonth()+1}/${sd.getDate()}`,tip:'Week of '+fmtDate(s,{month:'short',day:'numeric'}),keys:rangeKeys(addDays(s,6),7).filter(k=>k<=t)})}}
  else{const d=parseYmd(t);for(let i=11;i>=0;i--){const m=new Date(d.getFullYear(),d.getMonth()-i,1),keys=[],c=new Date(m);while(c.getMonth()===m.getMonth()&&ymd(c)<=t){keys.push(ymd(c));c.setDate(c.getDate()+1)}out.push({label:m.toLocaleDateString(undefined,{month:'short'}),tip:m.toLocaleDateString(undefined,{month:'long',year:'numeric'}),keys})}}
  return out;
}
const METRICS=[{id:'score',n:'Wellness score'},...RATINGS.map(k=>({id:k,n:SCALES[k].n})),...CONS.map(c=>({id:'c:'+c.k,n:c.n})),{id:'cons',n:'All consumption'},{id:'wk',n:'Workouts'},{id:'cmin',n:'Cardio minutes'}];
const isCount=id=>id.startsWith('c:')||id==='cons'||id==='wk'||id==='cmin';
let BY={};
function dayVal(k,id){
  const d=S.days[k];
  if(id==='wk')return(BY[k]||[]).length?1:0;
  if(id==='cmin')return sum((BY[k]||[]).map(wCardio));
  if(!hasAny(d))return null;
  if(id==='score')return score(d);
  if(SCALES[id])return pct(id,d[id]);
  if(id==='cons')return sum(Object.values(d.c||{}));
  return d.c?.[id.slice(2)]||0;
}
function bucketVal(b,id){const v=b.keys.map(k=>dayVal(k,id));if(isCount(id))return v.some(x=>x!=null)?sum(v):(id==='wk'||id==='cmin'?0:null);const a=avg(v);return a==null?null:Math.round(a)}
function pearson(xs,ys){const n=xs.length;if(n<5)return null;const mx=avg(xs),my=avg(ys);let a=0,b=0,c=0;for(let i=0;i<n;i++){const dx=xs[i]-mx,dy=ys[i]-my;a+=dx*dy;b+=dx*dx;c+=dy*dy}if(!b||!c)return null;return a/Math.sqrt(b*c)}
function corr(a,b,keys,lag){const xs=[],ys=[];for(const k of keys){const v1=dayVal(k,a),v2=dayVal(lag?addDays(k,1):k,b);if(v1!=null&&v2!=null){xs.push(v1);ys.push(v2)}}return pearson(xs,ys)}
const rText=r=>r==null?'not enough data':Math.abs(r)<.15?'no clear link':`${Math.abs(r)<.35?'weak':Math.abs(r)<.6?'moderate':'strong'} ${r>0?'positive':'negative'} link`;
function rColor(r){if(r==null)return'background:#F5F7FA;color:#B6C0CE';const a=Math.min(1,Math.abs(r)*1.25);return r>0?`background:rgba(43,99,246,${a*.85});color:${a>.5?'#fff':'#1A47C8'}`:`background:rgba(234,88,12,${a*.85});color:${a>.5?'#fff':'#9A3412'}`}

function corrView(B,rl){

  const by=wByDate();

/* ---------- sample data ---------- */
function sampleData(){
  const t=todayKey(),days={},workouts=[],state={};const R=Math.random;
  const prog=PROGRAMS.fb3;let idx=0,prevAlc=0,prevEn=0,prevW=0;const N=120;
  for(let i=N;i>=1;i--){
    const k=addDays(t,-i),dow=parseYmd(k).getDay(),p01=(N-i)/N;
    const wkday=[1,3,5].includes(dow)&&R()<.85||(dow===6&&R()<.2);
    const weekend=dow===5||dow===6;
    const c={energy:R()<.35-p01*.15?1+(R()<.25?1:0):0,coffee:Math.floor(R()*3.2),nicotine:R()<.45-p01*.3?1+Math.floor(R()*4):0,alcohol:R()<(weekend?.55:.1)?1+Math.floor(R()*3):0,cannabis:R()<.12?1:0,fastfood:R()<.35-p01*.2?1:0};
    const n=()=>(R()-.5)*.3;
    const sleepG=clamp(.55+n()-.12*prevAlc-.1*prevEn+.08*prevW+p01*.1,0,1);
    const stressL=clamp(.5+n()-.12*(wkday?1:0)+(dow===1?.1:0)-.08*sleepG-p01*.08,0,1);
    const gutG=clamp(.62+n()-.25*c.fastfood-.08*c.alcohol,0,1);
    const ovG=clamp((sleepG+(1-stressL)+gutG)/3+n()*.6+.04*(wkday?1:0)-.04*c.alcohol,0,1);
    if(R()<.93)days[k]={c,sleep:Math.round(sleepG*4),stress:Math.round(stressL*6),gut:Math.round(gutG*3),overall:Math.round(ovG*5),wo:wkday?(R()<.92?'yes':'no'):(R()<.18?'yes':'no')};
    prevAlc=c.alcohol?1:0;prevEn=c.energy?1:0;prevW=wkday?1:0;
    if(wkday){const D=prog.days[idx];const items=D.items.map(tp=>{const e=EX[tp.ex];const st=state[tp.ex]||(state[tp.ex]={});
        if(e.t==='c'){st.min=tp.min;if(e.f.includes('speed')){st.speed=+((st.speed??e.speed)+(R()<.3?.1:0)).toFixed(1);st.incline=Math.min(10,(st.incline??e.incline)+(R()<.2?.5:0))}if(e.f.includes('level'))st.level=Math.min(14,(st.level??e.level)+(R()<.2?1:0));return{ex:tp.ex,t:'c',min:tp.min+(R()<.3?5:0),speed:st.speed,incline:st.incline,level:st.level}}
        st.w=(st.w??e.w0)+(e.w0&&R()<(e.eq==='Dumbbell'?.07:.15)?5:0);return{ex:tp.ex,t:'s',sets:Array.from({length:tp.sets},(_,j)=>({reps:Math.max(1,tp.reps-(j===tp.sets-1&&R()<.4?2:0)+(e.w0?0:Math.floor(R()*3))),w:st.w}))}});
      workouts.push({id:uid()+i,date:k,name:D.n,planRef:{prog:'fb3',day:idx},items,saved:Date.now()-i*864e5});idx=(idx+1)%prog.days.length}
  }
  return{days,workouts,state,idx};
}

 async 'folder-on'(){
   try{
     if(DIR&&await folderPerm(true)){folderOK=true;await saveNow();render();toast('Folder access restored');return}
     const d=await showDirectoryPicker({mode:'readwrite',id:'vitalvault'});const prev=DIR;DIR=d;
     const existing=await folderRead();
     if(existing&&!await ask('Folder already has a vault','Overwrite it with your current data? (To load that vault instead, lock the app and use “Open vault from a folder”.)','Overwrite',true)){DIR=prev;return}
     await IDB.set('dir',d);folderOK=true;await saveNow();render();toast('Saving to “'+d.name+'” 🔒');
   }catch(e){if(e.name!=='AbortError')toast('Could not use that folder: '+e.message)}
 },
 async 'folder-off'(){await IDB.del('dir');DIR=null;folderOK=false;render();toast('Folder disconnected (your file stays there)')},
 async export(){
   const s=await encryptData(S),name=`vitalvault-backup-${todayKey()}.enc`;
   if(NFS){try{await NFS.writeFile({path:'VitalVault/'+name,directory:'DOCUMENTS',encoding:'utf8',data:s,recursive:true});toast('Saved to Documents/VitalVault/'+name)}catch(e){toast('Export failed: '+(e.message||e))}return}
   if('showSaveFilePicker' in window){try{const h=await showSaveFilePicker({suggestedName:name,types:[{description:'VitalVault backup',accept:{'application/octet-stream':['.enc']}}]});const w=await h.createWritable();await w.write(s);await w.close();toast('Backup saved')}catch(e){}return}
   const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'application/octet-stream'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('Backup downloaded');
 },
 import(){pickFile(async txt=>{
   const v=await askPass('Restore backup','Enter the passphrase this backup was created with.');if(!v)return;
   try{const r=await decryptBlob(txt,v[0]);if(!await ask('Replace current data?','Everything in the app will be replaced by the backup. Your current passphrase stays the same.','Replace',true))return;S=migrate(r.data);await saveNow();render();toast('Backup restored')}catch(e){toast(e.message)}})},
 async 'change-pass'(){
   const v=await askPass('Change passphrase','Enter your current passphrase, then the new one.',3);if(!v)return;const[cur,n1,n2]=v;
   try{await decryptBlob(await IDB.get('vault'),cur)}catch(e){toast('Current passphrase is incorrect');return}
   if(n1.length<6){toast('New passphrase must be at least 6 characters');return}if(n1!==n2){toast('New passphrases don\'t match');return}
   SALT=crypto.getRandomValues(new Uint8Array(16));KEY=await deriveKey(n1,SALT);await saveNow();toast('Passphrase changed 🔑');
 },
 async sample(){
   if(!await ask('Load sample data?','This replaces your logs and workout history with 4 months of demo data. Erase it later from Settings.','Load demo data',true))return;
   const d=sampleData();S.days=d.days;S.workouts=d.workouts;S.plan={prog:'fb3',idx:d.idx,state:d.state};S.active=null;S.settings.seen=[];await saveNow();UI.view='graphs';render();scrollTo(0,0);toast('Sample data loaded');
 },
 async wipe(){
   if(!await ask('Erase everything?','Your encrypted vault will be deleted from this device. Exported backups and folder files are not touched.','Continue',true))return;
   if(!await ask('Are you absolutely sure?','This cannot be undone.','Erase all data',true))return;
   await IDB.del('vault');await IDB.del('dir');await IDB.del('woq');if(NFS)try{await NFS.deleteFile({path:'VitalVault/'+VFILE,directory:'DATA'})}catch(e){}
   if(LN)try{await LN.cancel({notifications:[{id:1},{id:2}]})}catch(e){}
   KEY=S=null;DIR=null;folderOK=false;$('#main').innerHTML='';showLock();
 }
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.disabled)return;const f=A[t.dataset.a];if(f){e.preventDefault();f(t,e)}});

const IN={
 sname(t){S.active.name=t.value.trim()||'Workout';save()},
 sdate(t){if(t.value&&t.value<=todayKey()){S.active.date=t.value;save()}},
 w(t){const v=parseFloat(t.value);if(isNaN(v))return render();const it=S.active.items[+t.dataset.i];it.w=Math.max(0,toLb(v));it.sets.forEach(s=>{if(!s.done)s.w=it.w});save();render()},
 reps(t){const v=parseInt(t.value);if(isNaN(v))return render();S.active.items[+t.dataset.i].sets[+t.dataset.j].reps=Math.max(0,v);save();render()},
 cv(t){const v=parseFloat(t.value);if(isNaN(v))return render();const it=S.active.items[+t.dataset.i],f=t.dataset.f;it[f]=f==='speed'?Math.max(.1,toMph(v)):f==='min'?Math.max(1,Math.round(v)):Math.max(0,v);save();render()},
 unit(t){S.settings.unit=t.value;save();render()},
 autolock(t){S.settings.autolock=+t.value;save()},
 timeCheckin(t){if(t.value){S.settings.timeCheckin=t.value;save();setupNotifications(true);toast('Morning reminder set for '+fmtTime(t.value))}},
 timeWorkout(t){if(t.value){S.settings.timeWorkout=t.value;save();setupNotifications(true);toast('Workout question set for '+fmtTime(t.value))}},
 bsets(t){const v=parseInt(t.value);if(!isNaN(v))UI.edit.items[+t.dataset.i].sets=clamp(v,1,20);render()},
 breps(t){const v=parseInt(t.value);if(!isNaN(v))UI.edit.items[+t.dataset.i].reps=Math.max(1,v);render()},
 bmin(t){const v=parseInt(t.value);if(!isNaN(v))UI.edit.items[+t.dataset.i].min=Math.max(1,v);render()},
 'g-ex'(t){UI.gEx=t.value;render()},
 'g-cardio'(t){UI.gCardio=t.value;render()},
 'cmp-a'(t){UI.cmpA=t.value;render()},
 'cmp-b'(t){UI.cmpB=t.value;render()},
};
document.addEventListener('change',e=>{const t=e.target.closest('[data-in]');if(t&&IN[t.dataset.in])IN[t.dataset.in](t)});
document.addEventListener('input',e=>{const t=e.target;if(!t.dataset)return;if(t.dataset.in==='pick-q'&&UI.pick){UI.pick.q=t.value;$('#pick-list').innerHTML=pickerList()}else if(t.dataset.in==='bname'&&UI.edit){UI.edit.n=t.value;const c=$('#bcover .ct');if(c)c.textContent=t.value||'New routine'}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.stepper input,[data-in=sname],.bname'))e.target.blur();if(e.key==='Escape'&&!$('#modal').hidden)closeSheet()});
let rzT;addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(S&&UI.view==='graphs')render()},150)});
try{if(NATIVE&&CAP.Plugins.App)CAP.Plugins.App.addListener('backButton',()=>{if(!$('#modal').hidden)closeSheet();else if(S&&UI.view==='workout'&&(UI.edit||UI.detail)){A.wback()}else if(S&&UI.view!=='health'){UI.view='health';render()}else CAP.Plugins.App.exitApp()})}catch(e){}

showLock();
</script>
</body>
