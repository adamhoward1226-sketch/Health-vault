name: Build VitalVault APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Unlock signing key
        env:
          VV_SIGNING_SECRET: ${{ secrets.VV_SIGNING_SECRET }}
        run: |
          if [ -z "$VV_SIGNING_SECRET" ]; then
            echo "::error::Missing repository secret VV_SIGNING_SECRET. Add it under Settings → Secrets and variables → Actions, then re-run this workflow."
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing.enc -pass env:VV_SIGNING_SECRET | tar -xz
          test -f vitalvault.keystore && echo "Signing key unlocked"
      - name: Install
        run: npm install
      - name: Create Android project
        run: |
          npx cap add android
          node scripts/android-setup.mjs
          npx cap sync android
      - name: Build signed APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk VitalVault.apk
      - name: Remove unlocked key
        if: always()
        run: rm -f vitalvault.keystore keystore.properties
      - uses: actions/upload-artifact@v4
        with:
          name: VitalVault-apk
          path: VitalVault.apk
      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: VitalVault build ${{ github.run_number }}
          body: |
            📱 **On your Android phone, tap `VitalVault.apk` below to download, then open it to install.**
            Updates install over the old version and keep your data.
          files: VitalVault.apk
          make_latest: true
